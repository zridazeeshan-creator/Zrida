    <body>
        <h1>Introduction to Functions in JavaScript</h1>
        <script>
    function sumOfTwoNumbers() {
        let x,y,z;
        x = 5;
        y = 2;
        z = x + y;
        return z;
    }
    let result = sumOfTwoNumbers();
        document.write(result);
        document.write("the sum of  "+x+" and "+y+" is "+z);
        
        </script>
