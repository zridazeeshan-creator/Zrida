<html>

        <title>Multiplication using Functions</title>
    </head>
    <body>
        <h1>Introduction to Functions in JavaScript</h1>
        <script>
    function multiplyOfTwoNumbers() {
        let x,y,z;
        x = 5;
        y = 2;
        z = x * y;
        return z;
    }
    let result = multiplyOfTwoNumbers();
        document.write(result);
        document.write("the product of  "+x+" and "+y+" is "+z);
        
        </script>
    </body>
