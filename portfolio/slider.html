<html>
    <head>
        <title>slider</title>
    </head>
    <body>
        <section>
            <img class="myslides" src="CodyUnhealthyFood.png" alt="slide 1" style="height:500px;"> 
             <img class="myslides" src="COdyHealthy.png" alt="slide 2" style="height:500px;">
        
        </section>
        <script>
            
            var myIndex = 0;
            carousel();
            function carousel() {
                var i;
                var x = document.getElementsByClassName("myslides");
                for (i = 0; i < x.length; i++) {
                    x[i].style.display = "none";  
            }
            myIndex++;
            if (myIndex > x.length) {myIndex = 1}
            x[myIndex-1].style.display = "block";
            setTimeout(carousel, 3000); 
            }
        </script>
    </body>
</html>
