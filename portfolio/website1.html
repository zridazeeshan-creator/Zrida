<html>
    <head>  
        <title>My Website</title>
        <style>
            body, html {
                height: 100%;
                margin: 0;
                font-size: 16px;
                font-family:"lato", sans-serif;
                font-weight: 400;
                line-height: 1.8em;
                color: #666;
                background-color: #f5f5f5;
            }
            .pimg1, .pimg2, .pimg3 {
                position: relative;
                opacity: 0.70;
                background-position: center;
                background-size: cover;
                background-repeat: no-repeat;
                /* fixed = parallax */
                background-attachment: fixed;
            }
            .pimg3 {
                background-image: url("images(7).jpeg");
                min-height: 400px;
            }
            .section {
                text-align: center;
                padding: 50px 80px;
            }
.section-light {
                background-color: #f4f4f4;
                color: #666;
            }
            .ptext {
                position: absolute;
                top: 50%;
                width: 100%;
                text-align: center;
                color: #000;
                letter-spacing: 8px;
                text-transform: uppercase;
            }
            .ptext .border {
                background-color: #111;
                color: #fff;
                padding: 20px;
            }
            .ptext .border.trans {
                background-color: transparent;
            }
            @media(max-width: 568px) {
                .pimg1, .pimg2, .pimg3 {
                    background-attachment: scroll;
                }
            }
            body {
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 0;
            }
            .topnav {
                overflow: hidden;
                background-color: #333;
                text-align: center;
            }
            .topnav a {
                float: left;
                color: #f2f2f2;
                text-align: center;
                padding: 14px 16px;
                text-decoration: none;
                font-size: 17px;
            }
            .topnav a:hover {
                background-color: #ddd;
                color: black;
                text-align: center;
            }
            .topnav a.active {
                background-color: #04AA6D;
                color: white;
                text-align: center;

            }
        </style>
    </head>
    <body>
<div class="topnav">
    <a class="active" href="#home">Home</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
</div><br>
<span class="border trans" style="font-size: 40px; ">
    <center>welcome all to the website</center>
</span><br>
<section>
    <h2>Chinese cuisine</h2>
<p>Chinese cuisine is a style of cooking originating from China, and has influenced many other cuisines in the world.</p>
</section>
<div class="pimg3">
    <div class="ptext">
        <span class="border trans">image two text</span> 
            <h2>Chinese cuisine</h2>
        </span>
    </div>
<div>
    <section class="section section-dark">
        <span>all @ copy right reserved by swati singh</span>

    </section>


    </body>
</html>
