<html>
    <head>
        <title>Positioning</title>
        <style>
            div {
                
                
                background-color: lightblue;
                margin: 10px;
                padding: 10px;
            }
            .sticky {
                position: sticky;
                
            }
            .fixed {
                position: fixed;
            
            }
            .relative {
                position: relative;
            }
            .absolute {
                position: absolute;
                top: 20px;
                left: 20px;
            }
        </style>
    </head>
    <body>
        <h1>Positioning</h1>
        <div>Division with no positioning property</div>
        <div class="sticky">Division with sticky positioning property</div>
        <div class="fixed">Division with fixed positioning property</div>
        <div class="relative">Division with relative positioning property
            <div class="absolute">
                Division with absolute positioning property>
                </div>
        </div>
        <div style="height: 1800px;" ></div>
    </body>
</html>
